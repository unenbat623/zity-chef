<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Orange rounded square background -->
  <rect width="64" height="64" rx="14" fill="#FF9F1C"/>

  <!-- Chef hat - crown part (white puff) -->
  <ellipse cx="32" cy="22" rx="17" ry="13" fill="white"/>

  <!-- Hat brim band -->
  <rect x="15" y="33" width="34" height="8" rx="3" fill="white"/>

  <!-- Hat crown highlight -->
  <ellipse cx="26" cy="18" rx="5" ry="4" fill="white" opacity="0.5"/>

  <!-- Subtle orange shadow under hat -->
  <rect x="15" y="38" width="34" height="3" rx="2" fill="#E8890A" opacity="0.4"/>

  <!-- Fork tines (left side) -->
  <line x1="21" y1="45" x2="21" y2="56" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="25" y1="45" x2="25" y2="56" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M21 45 Q23 49 25 45" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Spoon (right side) -->
  <ellipse cx="41" cy="48" rx="3.5" ry="4.5" fill="white"/>
  <line x1="41" y1="52" x2="41" y2="58" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
</svg>